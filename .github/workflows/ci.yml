name: Windows source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  markdown-links:
    name: Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check Markdown links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --root-dir "$GITHUB_WORKSPACE" --no-progress --include-fragments
            --exclude-loopback --timeout 15 --max-retries 2
            './**/*.md' './.github/**/*.md'

  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    env:
      AUTOQUESTION_CI: '1'
      PLAYWRIGHT_BROWSERS_PATH: '0'
      PYTHONUTF8: '1'
      INPUT_MODE: demo
      LLM_PROVIDER: fake
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Isolate application configuration
        run: |
          $isolatedConfig = Join-Path $env:RUNNER_TEMP 'autoquestion-appdata'
          New-Item -ItemType Directory -Force $isolatedConfig | Out-Null
          "APPDATA=$isolatedConfig" >> $env:GITHUB_ENV
      - run: python -m venv .venv-win
      - run: .\.venv-win\Scripts\python.exe -m pip install -r requirements-dev.txt
      - run: .\.venv-win\Scripts\python.exe -m playwright install chromium
      - name: pytest (bridge, extension, router and regressions)
        run: .\.venv-win\Scripts\python.exe -m pytest -q
      - name: unittest (same complete suite)
        run: .\.venv-win\Scripts\python.exe -m unittest discover -s tests -v
      - run: .\.venv-win\Scripts\python.exe -m compileall -q main.py src tests tools
      - run: .\.venv-win\Scripts\python.exe -m pip check
      - run: .\.venv-win\Scripts\python.exe tools/release_audit.py
      - run: .\.venv-win\Scripts\python.exe main.py --version
      - run: .\.venv-win\Scripts\python.exe main.py --doctor
      # Visible HWND/focus smoke and real providers/credentials are local manual tests.
      # MV3 integration uses an owned headless Chromium profile and a synthetic host grant.
      # Real Chrome/Edge GUI acceptance requires a separate manual check.
