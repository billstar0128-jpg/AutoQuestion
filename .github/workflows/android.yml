name: Android checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Install verified Android command-line tools and platform
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/autoquestion-android-sdk"
          archive="$RUNNER_TEMP/android-commandlinetools.zip"
          unpacked="$(mktemp -d "$RUNNER_TEMP/android-cli.XXXXXX")"
          # Pinned official Android download and SHA-256 from developer.android.com/studio.
          curl --fail --location --retry 3 --output "$archive" \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          printf '%s  %s\n' \
            4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583 "$archive" \
            | sha256sum --check --status
          unzip -q "$archive" -d "$unpacked"
          mkdir -p "$sdk_root/cmdline-tools"
          mv "$unpacked/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          # Finite input avoids `yes` receiving SIGPIPE under bash pipefail.
          printf 'y\n%.0s' {1..100} | "$sdk_manager" --sdk_root="$sdk_root" --licenses > /dev/null
          "$sdk_manager" --sdk_root="$sdk_root" 'platforms;android-36' 'build-tools;35.0.0'
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Compile, test and lint (no API calls or private signing key)
        run: gradle -p android --no-daemon --console=plain assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v7
        with:
          name: AutoQuestion-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
